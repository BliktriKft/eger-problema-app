# Railway project config — opts the service into watching `apps/**`
# source changes so that updates to apps/api/src, apps/web/src, etc.
# trigger a redeploy without needing a manual click in the dashboard.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node apps/api/dist/main.js"
healthcheckPath = "/health/live"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
watchPaths = [
    "apps/**",
    "packages/**",
    "Dockerfile",
    "pnpm-lock.yaml",
    ".env.example"
]
